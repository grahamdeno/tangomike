# Publishes tangomike.app (the Cloudflare Pages project tangomike-home, a Direct Upload) from site/ on main.
# Each deploy is the whole site. If a page or the Cloudflare secrets are missing, it stops before uploading,
# so a partial site never replaces the live one. SITE_URL (a repo variable) is the address the check reads:
# the pages.dev address until tangomike.app is moved onto this project, then https://tangomike.app.
name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://tangomike-home.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the site is complete
        id: build
        run: |
          missing=""
          for f in site/index.html site/404.html site/site.css site/_headers site/img/logo.png site/img/mark.png; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then echo "::warning::Not publishing: missing$missing"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Publish to Cloudflare Pages
        if: steps.build.outputs.ok == 'true' && env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages deploy site --project-name=tangomike-home --branch=main --commit-dirty=true
      - name: No Cloudflare key yet
        if: steps.build.outputs.ok == 'true' && env.HAS_TOKEN != 'true'
        run: |
          echo "::warning::Not publishing: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repo's secrets."
      - name: Check the live site
        if: steps.build.outputs.ok == 'true' && env.HAS_TOKEN == 'true'
        run: |
          sleep 20
          body=$(curl -fsSL "$SITE_URL/") || { echo "::error::$SITE_URL did not load"; exit 1; }
          echo "$body" | grep -q "Small apps that give your attention back" && echo "::notice::$SITE_URL ok" || { echo "::error::$SITE_URL is not the new site"; exit 1; }
